# Tableau de bord privé d'Ahmed : chaque matin, lit les chiffres de tous les sites (dépôts publics et privés), les chiffre avec le
# code d'Ahmed et publie la page ici. Déplacé du dépôt privé projets-ahmed le 27/10/2026 (dépôt public = minutes gratuites).
# Le programme reste dans projets-ahmed (« tableau de bord/ », lu avec CLE_PROJETS) ; rien de lisible n'est publié sans le code.
# Secrets de CE dépôt : TABLEAU_JETON (jeton GitHub d'Ahmed, LECTURE seule), TABLEAU_CODE (code d'Ahmed), CLE_PROJETS.
name: tableau-bord
on:
  schedule:
    - cron: "45 8 * * *"        # 9h45 à Tunis, après les robots du matin
  workflow_dispatch:
permissions:
  contents: write
concurrency: tableau-bord
jobs:
  tableau:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONIOENCODING: utf-8
      TZ: Africa/Tunis
    steps:
      - uses: actions/checkout@v4
        with:
          path: publie
      - uses: actions/checkout@v4
        with:
          repository: Ah6259/projets-ahmed
          ssh-key: ${{ secrets.CLE_PROJETS }}
          path: src
          sparse-checkout: tableau de bord
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet cryptography
      - name: Collecte et chiffrement
        env:
          GH_TOKEN: ${{ secrets.TABLEAU_JETON }}
          TABLEAU_CODE: ${{ secrets.TABLEAU_CODE }}
          ANCIEN: publie/donnees.bin
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "::error::Secret TABLEAU_JETON absent de ce dépôt : voir « tableau de bord/GERER SANS CLAUDE.md »"; exit 1; fi
          python "src/tableau de bord/collecte.py"
      - name: Publication
        run: |
          cp "src/tableau de bord/sortie/donnees.bin" "src/tableau de bord/page/index.html" publie/
          cd publie
          git config user.name "robot tableau-bord"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add donnees.bin index.html
          git diff --cached --quiet && { echo "Rien de neuf"; exit 0; }
          git commit -qm "Chiffres du $(date +%d/%m/%Y)"
          for i in 1 2 3; do git pull -q --rebase && git push -q && exit 0; sleep 10; done
          exit 1
