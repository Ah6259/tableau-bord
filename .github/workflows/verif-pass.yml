# ROBOT DES PASS (18/10/2026) : chaque jour, ouvre les pages Pass EN LIGNE de tous les sites dans Chrome à 390 px, comme un
# visiteur, et vérifie la règle commune § 11.10. Rouge = e-mail de GitHub. Déplacé du dépôt privé projets-ahmed le 27/10/2026
# (dépôt public = minutes gratuites) ; l'outil reste dans projets-ahmed (« outils communs/verif-pass/ »), lu avec CLE_PROJETS.
name: verif-pass
on:
  schedule:
    - cron: "17 6 * * *"        # 7h17 à Tunis, après les publications de la nuit
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verif-pass
  cancel-in-progress: true
jobs:
  verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Ah6259/projets-ahmed
          ssh-key: ${{ secrets.CLE_PROJETS }}
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            outils communs/verif-pass/
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Pages Pass vérifiées comme un visiteur
        run: node "outils communs/verif-pass/verifier_pass.mjs"
