<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<title>Tableau de bord</title>
<style>
:root{--fond:#f4f6f9;--carte:#fff;--texte:#1b2430;--doux:#5d6b7c;--ligne:#e3e8ee;--vert:#15803d;--vertf:#dcfce7;--rouge:#b91c1c;--rougef:#fee2e2;--orange:#b45309;--orangef:#fef3c7;--bleu:#1d4ed8;--bleuf:#dbeafe}
@media (prefers-color-scheme:dark){:root{--fond:#0f141b;--carte:#18202a;--texte:#e6ebf1;--doux:#9aa7b6;--ligne:#2a3441;--vert:#4ade80;--vertf:#14301f;--rouge:#f87171;--rougef:#3a1717;--orange:#fbbf24;--orangef:#382a0c;--bleu:#93b4ff;--bleuf:#18264a}}
*{box-sizing:border-box}
body{margin:0;background:var(--fond);color:var(--texte);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:1180px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0 2px}h2{font-size:17px;margin:28px 0 10px}
.sous{color:var(--doux);font-size:13px}
.carte{background:var(--carte);border:1px solid var(--ligne);border-radius:12px}
#entree{max-width:360px;margin:12vh auto;padding:24px}
#entree input[type=password]{width:100%;font-size:18px;padding:10px 12px;border:1px solid var(--ligne);border-radius:8px;background:var(--fond);color:var(--texte);margin:12px 0 8px}
button{font:inherit;padding:9px 16px;border-radius:8px;border:0;background:var(--bleu);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--doux);border:1px solid var(--ligne);padding:6px 12px;font-size:13px}
#msg{color:var(--rouge);min-height:20px;font-size:14px}
.chiffres{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:14px}
.chiffres .carte{padding:12px 14px}.chiffres b{display:block;font-size:24px}.chiffres span{color:var(--doux);font-size:13px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--ligne);vertical-align:top}
th{color:var(--doux);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.03em}
td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}th.n{text-align:right}
tr.site{cursor:pointer}tr.site:hover td{background:var(--fond)}
tr.det td{background:var(--fond);font-size:13px;color:var(--doux)}
tr[hidden]{display:none!important}
.p{display:inline-block;padding:1px 8px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.ok{background:var(--vertf);color:var(--vert)}.ko{background:var(--rougef);color:var(--rouge)}.at{background:var(--orangef);color:var(--orange)}.in{background:var(--bleuf);color:var(--bleu)}
.plus{color:var(--vert);font-weight:600}.moins{color:var(--rouge);font-weight:600}
a{color:var(--bleu);text-decoration:none}
h3{font-size:14px;margin:16px 0 8px;color:var(--doux)}
summary{cursor:pointer}
.afaire{margin:6px 0 4px;padding-left:20px}.afaire li{margin:3px 0}
.chiffres .carte.clic{cursor:pointer;transition:border-color .15s,transform .15s}
.chiffres .carte.clic:hover,.chiffres .carte.clic:focus-visible{border-color:var(--bleu);outline:none;transform:translateY(-1px)}
.chiffres .carte.clic span::after{content:" ›";color:var(--bleu)}
.chiffres .carte span[data-vide]::after{content:" · aucun"}
h2{scroll-margin-top:12px}
h2.eclair{animation:eclair 1.6s}
@keyframes eclair{0%{background:var(--bleuf)}100%{background:transparent}}
.journal{font:12px/1.5 ui-monospace,Consolas,monospace;background:var(--carte);border:1px solid var(--ligne);border-radius:8px;padding:8px 10px;margin:6px 0;white-space:pre-wrap;word-break:break-word;color:var(--texte)}
.boite{overflow-x:auto}
.haut{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.vide{color:var(--doux)}
@media (max-width:760px){
 table.cartes thead{display:none}
 table.cartes tr{display:block;border-bottom:1px solid var(--ligne);padding:8px 4px}
 table.cartes td{display:flex;justify-content:space-between;gap:10px;border:0;padding:3px 8px;text-align:right}
 table.cartes td::before{content:attr(data-l);color:var(--doux);font-size:12px;text-align:left}
 table.cartes td:first-child{font-weight:700;font-size:15px}
 table.cartes td:first-child::before{content:""}
 table.cartes tr.det td{display:block;text-align:left;font-weight:400;font-size:13px}
 table.cartes tr.det td::before{content:none}
}
</style>
</head>
<body>
<main>
<div id="entree" class="carte">
  <h1>Tableau de bord</h1>
  <div class="sous">Page privée. Tapez votre code.</div>
  <form id="f"><input type="password" id="code" autocomplete="current-password" placeholder="Code" autofocus>
  <label class="sous"><input type="checkbox" id="garder"> Se souvenir sur cet appareil</label><br><br>
  <button>Ouvrir</button></form>
  <div id="msg"></div>
</div>
<div id="tdb" hidden></div>
</main>
<script>
"use strict";
const QUOTIDIENS = new Set(["immobilier","eau","concours","ao","conf"]);
const $ = s => document.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const nf = n => n == null ? "—" : Number(n).toLocaleString("fr-FR");
const delta = n => n == null ? "—" : n > 0 ? `<span class="plus">+${nf(n)}</span>` : n < 0 ? `<span class="moins">${nf(n)}</span>` : "0";
const lire = k => { try { return localStorage.getItem(k); } catch { return null; } };
const ecrire = (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} };

async function dechiffrer(texte, code) {
  const b = Uint8Array.from(atob(texte.trim()), c => c.charCodeAt(0));
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(code), "PBKDF2", false, ["deriveKey"]);
  const cle = await crypto.subtle.deriveKey({name:"PBKDF2", salt:b.slice(0,16), iterations:250000, hash:"SHA-256"},
    base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const clair = await crypto.subtle.decrypt({name:"AES-GCM", iv:b.slice(16,28)}, cle, b.slice(28));
  return JSON.parse(new TextDecoder().decode(clair));
}

async function ouvrir(code, garder) {
  $("#msg").textContent = "Ouverture…";
  let texte;
  try { texte = await (await fetch("donnees.bin?t=" + Date.now(), {cache:"no-store"})).text(); }
  catch { $("#msg").textContent = "Fichier introuvable. Réessayez plus tard."; return; }
  try {
    const d = await dechiffrer(texte, code);
    if (garder) ecrire("tdb-code", code);
    $("#entree").hidden = true; $("#tdb").hidden = false; afficher(d);
  } catch { ecrire("tdb-code", null); $("#msg").textContent = "Code incorrect."; }
}

function ageJours(j) { return j ? Math.round((Date.parse(new Date().toISOString().slice(0,10)) - Date.parse(j)) / 864e5) : null; }
function dateFr(j) { return j ? j.slice(8,10) + "/" + j.slice(5,7) + "/" + j.slice(0,4) : "—"; }

function passTexte(p) {
  if (!p) return "—";
  const lib = {pass:"Pass actifs", inscrits:"inscrits", telegram:"Telegram", alertes:"alertes", canal:"canal", "canal Telegram":"abonnés canal Telegram", pro:"Pro", avis:"avis"};
  const parts = Object.entries(p).filter(([,v]) => v != null).map(([k,v]) => `${nf(v)} ${lib[k] || k}`);
  return parts.length ? parts.join(" · ") : "—";
}

function afficher(d) {
  const S = d.sites;
  // 23/10/2026 : état ok | ko (à réparer) | attend (réparation envoyée, attend son prochain passage) | arrete (ne tourne plus)
  const etat = r => r.etat || (r.ok ? "ok" : "ko");
  const rouges = S.flatMap(s => s.robots.filter(r => etat(r) === "ko").map(r => ({...r, site:s.nom})));
  const attente = S.flatMap(s => s.robots.filter(r => etat(r) === "attend").map(r => ({...r, site:s.nom})));
  const arretes = S.flatMap(s => s.robots.filter(r => etat(r) === "arrete").map(r => ({...r, site:s.nom})));
  const passActifs = S.reduce((t, s) => t + ((s.pass && s.pass.pass) || 0), 0);
  const ajoutes = S.reduce((t, s) => t + (s.ajout_robot || 0), 0);
  let h = `<div class="haut"><div><h1>Tableau de bord</h1><div class="sous">Chiffres du ${esc(d.genere)} (mis à jour chaque matin par le robot)</div></div>
    <button class="sec" id="sortir">Fermer${lire("tdb-code") ? " et oublier le code" : ""}</button></div>
  <div class="chiffres">
    <div class="carte"><b>${S.filter(s => s.statut === "en ligne").length}</b><span>sites en ligne</span></div>
    <div class="carte"><b class="plus">${S.filter(s => (s.autonomie || {}).niveau === "autonome").length} / ${S.length}</b><span>sites autonomes</span></div>
    <div class="carte"><b class="${rouges.length ? "moins" : "plus"}">${rouges.length}</b><span>robot(s) à réparer</span></div>
    <div class="carte"><b style="color:var(--orange)">${attente.length}</b><span>réparé(s), attendent leur prochain passage</span></div>
    <div class="carte"><b>${nf(passActifs)}</b><span>Pass actifs</span></div>
    <div class="carte"><b>${nf(ajoutes)}</b><span>éléments ajoutés aujourd'hui par les robots</span></div>
    <div class="carte"><b>${nf(d.personnes.length)}</b><span>clients et abonnés</span></div>
  </div>`;
  const tableRobots = (liste, titre, sous, cls, pre) => !liste.length ? "" : `<h2>${titre}</h2><div class="sous" style="margin:-4px 0 8px">${sous}</div><div class="carte boite"><table class="cartes"><thead><tr><th>Site</th><th>Robot</th><th>Dépôt</th><th>Dernier passage</th></tr></thead><tbody>${
    liste.map((r, i) => `<tr class="site" data-d="${pre}${i}"><td>${esc(r.site)}</td><td data-l="Robot"><span><span class="p ${cls}">${esc(r.nom)} ▸</span></span></td><td data-l="Dépôt"><span>${esc(r.depot)}</span></td><td data-l="Dernier passage"><span>${dateFr(r.date)}</span></td></tr>
      <tr class="det" id="${pre}${i}" hidden><td colspan="4">${r.reparation ? `<p><b>Réparation envoyée</b> le ${esc(r.reparation.date)} (${esc(r.reparation.depot)}) : ${esc(r.reparation.message)}</p>` : ""}${cause(r)}</td></tr>`).join("")}</tbody></table></div>`;

  h += tableRobots(rouges, "Robots à réparer", "Touchez un robot pour voir la cause.", "ko", "cause");
  h += tableRobots(attente, "Réparés, attendent leur prochain passage", "En échec avant la réparation : ils redeviennent verts seuls à leur prochain passage.", "at", "att");
  h += tableRobots(arretes, "Robots qui ne tournent plus", "Plus aucun passage depuis 7 jours : jamais comptés rouges.", "in", "arr");
  h += sectionAutonomie(d);
  h += `<h2>Sites</h2><div class="sous" style="margin:-4px 0 8px">Touchez une ligne pour voir le détail.</div><div class="carte boite"><table class="cartes"><thead><tr>
    <th>Site</th><th>Statut</th><th>Mise à jour</th><th class="n">Total</th><th class="n">Ajoutés aujourd'hui</th><th class="n">Depuis hier</th><th class="n">7 jours</th><th>Visiteurs</th><th>Pass / abonnés</th><th>Robots</th></tr></thead><tbody>`;
  S.forEach((s, i) => {
    const age = ageJours(s.maj);
    const vieux = QUOTIDIENS.has(s.id) && age != null && age > 1;
    const ko = s.robots.filter(r => etat(r) === "ko"), att = s.robots.filter(r => etat(r) === "attend");
    h += `<tr class="site" data-d="det${i}">
      <td>${badgeAuto(s)} <a href="${esc(s.url)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">${esc(s.nom)}</a></td>
      <td data-l="Statut"><span><span class="p ${s.statut === "en ligne" ? "ok" : "in"}">${esc(s.statut)}</span></span></td>
      <td data-l="Mise à jour"><span>${s.maj ? `<span class="${vieux ? "p ko" : ""}">${dateFr(s.maj)}</span>` : "—"}</span></td>
      <td data-l="Total" class="n"><span>${s.total != null ? nf(s.total) + ` <span class="sous">${esc(s.unite || "")}</span>` : "—"}</span></td>
      <td data-l="Ajoutés aujourd'hui" class="n"><span>${s.ajout_robot != null ? delta(s.ajout_robot) + (s.ajout_lib ? ` <span class="sous">${esc(s.ajout_lib)}</span>` : "") : "—"}</span></td>
      <td data-l="Depuis hier" class="n"><span>${delta(s.evolution_jour)}</span></td>
      <td data-l="7 jours" class="n"><span>${delta(s.evolution_7j)}</span></td>
      <td data-l="Visiteurs"><span>${s.visiteurs != null ? `${nf(s.visiteurs)} <span class="sous">${esc(s.visiteurs_lib || "")}</span>` : "—"}</span></td>
      <td data-l="Pass / abonnés"><span>${esc(passTexte(s.pass))}</span></td>
      <td data-l="Robots"><span>${!s.robots.length ? "—" : ko.length ? `<span class="p ko">${ko.length} rouge(s) / ${s.robots.length}</span>` : att.length ? `<span class="p at">${att.length} réparé(s), en attente / ${s.robots.length}</span>` : `<span class="p ok">${s.robots.length} verts</span>`}</span></td></tr>
      <tr class="det" id="det${i}" hidden><td colspan="10">${detail(s)}</td></tr>`;
  });
  h += `</tbody></table></div>`;

  h += `<h2>Modèles de site</h2><div class="carte boite"><table class="cartes"><thead><tr><th>Modèle</th><th>Statut</th><th>Sert à</th><th>Où</th><th>Dernière modification</th></tr></thead><tbody>${
    d.modeles.map(m => `<tr><td>${esc(m.nom)}</td><td data-l="Statut"><span><span class="p ${m.statut === "actif" ? "ok" : "at"}">${esc(m.statut)}</span></span></td><td data-l="Sert à"><span>${esc(m.sert)}</span></td><td data-l="Où"><span><span class="sous">${esc(m.ou)}</span></span></td><td data-l="Modifié"><span>${dateFr(m.maj)}</span></td></tr>`).join("")}</tbody></table></div>`;

  const groupes = [...new Set(d.projets.map(p => p.groupe))];
  h += `<h2>Projets futurs (${d.projets.length})</h2><div class="sous" style="margin:-4px 0 8px">Lus chaque matin dans « liste des idees de sites.md » et « liste des idees du robot.md ». Touchez un projet pour le détail.</div>`;
  groupes.forEach((g, gi) => {
    const ps = d.projets.filter(p => p.groupe === g);
    h += `<h3>${esc(g)} <span class="sous">(${ps.length})</span></h3><div class="carte boite"><table class="cartes"><thead><tr><th>Projet</th><th>Où on en est</th><th>Depuis</th></tr></thead><tbody>${
      ps.map((p, i) => `<tr class="site" data-d="pj${gi}_${i}"><td>${esc(p.nom)}</td><td data-l="Où on en est"><span><span class="p at">${esc(p.statut)}</span></span></td><td data-l="Depuis"><span>${dateFr(p.date)}</span></td></tr>
        <tr class="det" id="pj${gi}_${i}" hidden><td colspan="3">${esc(p.detail || "Pas d'autre détail.")}</td></tr>`).join("")}</tbody></table></div>`;
  });

  const T = d.travail || {ahmed: [], taches: []};
  h += `<h2>Liste de travail</h2><div class="sous" style="margin:-4px 0 8px">Lue dans « liste de ce qu'on va developper.md » : seulement ce qui n'est pas fait.</div>
    <h3>À faire par toi <span class="sous">(${T.ahmed.length})</span></h3><div class="carte boite"><table class="cartes"><thead><tr><th>N°</th><th>Quoi</th></tr></thead><tbody>${
    T.ahmed.length ? T.ahmed.map(t => `<tr><td>${esc(t.n)}</td><td data-l="Quoi"><span>${esc(t.quoi)}</span></td></tr>`).join("") : `<tr><td colspan="2" class="vide">Rien.</td></tr>`}</tbody></table></div>
    <details class="carte" style="margin-top:10px;padding:10px 14px"><summary><b>Tâches ouvertes sur les sites (${T.taches.length})</b> <span class="sous">— toucher pour ouvrir</span></summary>
    <div class="boite"><table class="cartes"><thead><tr><th>N°</th><th>Partie</th><th>Quoi</th><th>Qui</th></tr></thead><tbody>${
    T.taches.map(t => `<tr><td>${esc(t.n)}</td><td data-l="Partie"><span>${esc(t.partie)}</span></td><td data-l="Quoi"><span>${esc(t.quoi)}</span></td><td data-l="Qui"><span>${esc(t.qui || "—")}</span></td></tr>`).join("")}</tbody></table></div></details>`;

  h += `<h2>Clients et abonnés</h2><div class="sous" style="margin:-4px 0 8px">Personnes enregistrées dans les dépôts privés. Les demandes de Pass pas encore payées arrivent par e-mail (Formspree) : elles ne sont pas ici.</div>
    <div class="carte boite"><table class="cartes"><thead><tr><th>Nom</th><th>Contact</th><th>Site</th><th>Type</th><th>Code</th><th>Début</th><th>Fin</th><th>Statut</th></tr></thead><tbody>${
    d.personnes.length ? d.personnes.map(p => `<tr><td>${esc(p.nom || "(sans nom)")}</td><td data-l="Contact"><span>${esc(p.contact || "—")}</span></td><td data-l="Site"><span>${esc(p.site)}</span></td><td data-l="Type"><span>${esc(p.type)}</span></td><td data-l="Code"><span>${esc(p.code || "—")}</span></td><td data-l="Début"><span>${dateFr(p.debut)}</span></td><td data-l="Fin"><span>${dateFr(p.fin)}</span></td><td data-l="Statut"><span>${p.statut ? `<span class="p ${/actif|paye|alerte/.test(p.statut) ? "ok" : "at"}">${esc(p.statut)}</span>` : "—"}</span></td></tr>`).join("")
    : `<tr><td colspan="8" class="vide">Personne pour l'instant.</td></tr>`}</tbody></table></div>`;

  if (d.erreurs && d.erreurs.length) h += `<h2>Lectures en échec</h2><div class="carte" style="padding:12px 14px"><ul class="sous">${d.erreurs.map(e => `<li>${esc(e)}</li>`).join("")}</ul></div>`;
  $("#tdb").innerHTML = h;
  document.querySelectorAll("tr.site").forEach(tr => tr.addEventListener("click", () => { const x = document.getElementById(tr.dataset.d); x.hidden = !x.hidden; }));
  $("#sortir").addEventListener("click", () => { ecrire("tdb-code", null); location.reload(); });
}

function cause(r) {
  const l = [];
  if (r.etapes && r.etapes.length) l.push(`Étape en échec : <b>${r.etapes.map(esc).join(", ")}</b>`);
  if (r.messages && r.messages.length) l.push(`<div class="journal">${r.messages.map(esc).join("<br>")}</div>`);
  if (r.lien) l.push(`<a href="${esc(r.lien)}" target="_blank" rel="noopener">Voir le passage complet sur GitHub ↗</a>`);
  return l.join("") || "Pas de détail.";
}

// 23/10/2026 (Ahmed : « le but de nos sites est qu'ils soient autonomes ») : niveau devant le nom + liste « à faire »
const NIVEAUX = {autonome: ["ok", "✅ autonome"], presque: ["at", "🟠 presque"], non: ["ko", "🔴 pas autonome"], inconnu: ["in", "? à évaluer"]};
function badgeAuto(s) {
  const [cls, lib] = NIVEAUX[(s.autonomie || {}).niveau] || NIVEAUX.inconnu;
  return `<span class="p ${cls}" title="Autonomie">${lib}</span>`;
}
function listeAFaire(s) {
  const a = (s.autonomie || {}).a_faire || [];
  return a.length ? `<ul class="afaire">${a.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : `<span class="plus">Rien à faire : site autonome.</span>`;
}
function sectionAutonomie(d) {
  const S = d.sites, ordre = {non: 0, presque: 1, inconnu: 2, autonome: 3};
  const tries = [...S].sort((a, b) => (ordre[(a.autonomie || {}).niveau] ?? 2) - (ordre[(b.autonomie || {}).niveau] ?? 2));
  return `<h2>Autonomie des sites</h2><div class="sous" style="margin:-4px 0 8px">But : chaque site vit seul. ✅ autonome = ni toi, ni le PC, ni Claude (sauf pour réparer une panne) ;
    🟠 presque = seul geste : vérifier un paiement et appuyer sur le bouton du Pass ; 🔴 = dépend du PC ou d'un geste régulier.
    Touchez un site pour sa liste « à faire ». Liste modifiable sur GitHub : « tableau de bord/autonomie.json ».</div>
    ${(d.autonomie_commun || []).length ? `<div class="carte" style="padding:10px 14px;margin-bottom:10px"><b>Pour tous les sites</b><ul class="afaire">${d.autonomie_commun.map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>` : ""}
    <div class="carte boite"><table class="cartes"><thead><tr><th>Site</th><th>Autonomie</th><th class="n">À faire</th></tr></thead><tbody>${
    tries.map((s, i) => { const n = ((s.autonomie || {}).a_faire || []).length;
      return `<tr class="site" data-d="auto${i}"><td>${esc(s.nom)}</td><td data-l="Autonomie"><span>${badgeAuto(s)}</span></td><td data-l="À faire" class="n"><span>${n ? n + " ▸" : "—"}</span></td></tr>
        <tr class="det" id="auto${i}" hidden><td colspan="3">${listeAFaire(s)}</td></tr>`; }).join("")}</tbody></table></div>`;
}

function detail(s) {
  const l = [`<b>À faire pour l'autonomie</b> ${listeAFaire(s)}`];
  if (s.maj_lib) l.push(`Date affichée : ${esc(s.maj_lib)}.`);
  Object.entries(s.details || {}).forEach(([k, v]) => l.push(`${esc(k)} : <b>${esc(typeof v === "number" ? nf(v) : String(v ?? "—").replace(/(\d{4})-(\d\d)-(\d\d)/g, "$3/$2/$1"))}</b>`));
  if (s.robots.length) l.push("Robots : " + s.robots.map(r => `<span class="p ${({ ok: "ok", ko: "ko", attend: "at", arrete: "in" })[r.etat || (r.ok ? "ok" : "ko")]}">${esc(r.nom)} ${dateFr(r.date).slice(0,5)}</span>`).join(" "));
  return l.length ? l.join("<br>") : "Pas d'autre détail.";
}

// 23/10/2026 (Ahmed : « ces boutons doivent fonctionner ») : chaque case du haut mène à sa section (titre h2 trouvé par ses
// premiers mots) ; branché après chaque affichage, sans toucher au code qui dessine les cases.
const CASES = [[/sites en ligne/i, /^Sites/], [/autonomes/i, /^Autonomie/], [/à réparer|en échec/i, /^Robots (à réparer|en échec)/], [/attendent/i, /^Réparés/],
  [/Pass actifs/i, /^Clients/], [/ajoutés aujourd/i, /^Sites/], [/clients et abonnés/i, /^Clients/]];
function brancherCases() {
  document.querySelectorAll(".chiffres .carte").forEach(c => {
    if (c.dataset.branche) return;
    c.dataset.branche = "1";
    const lib = c.querySelector("span")?.textContent || "";
    const cible = (CASES.find(([l]) => l.test(lib)) || [])[1];
    if (!cible) return;
    c.classList.add("clic"); c.tabIndex = 0; c.setAttribute("role", "button");
    const aller = () => {
      const h2 = [...document.querySelectorAll("#tdb h2")].find(h => cible.test(h.textContent.trim()));
      if (!h2) { c.querySelector("span").dataset.vide = "1"; setTimeout(() => delete c.querySelector("span").dataset.vide, 1800); return; }
      h2.scrollIntoView({behavior: "smooth", block: "start"});
      h2.classList.remove("eclair"); void h2.offsetWidth; h2.classList.add("eclair");
    };
    c.addEventListener("click", aller);
    c.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); aller(); } });
  });
}
new MutationObserver(brancherCases).observe($("#tdb"), {childList: true});

$("#f").addEventListener("submit", e => { e.preventDefault(); const c = $("#code").value; if (c) ouvrir(c, $("#garder").checked); });
const memo = lire("tdb-code");
if (memo) ouvrir(memo, true);
</script>
