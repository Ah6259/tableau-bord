# Contrôle de TOUS les sites clicvia.com (règles communes § 8, § 21, § 22). Déplacé du dépôt privé projets-ahmed le 27/10/2026
# (décision d'Ahmed : dépôt PUBLIC = minutes gratuites). Les outils restent dans projets-ahmed : lus avec la clé CLE_PROJETS
# (seulement « outils visibilite/ » et le carnet « defauts a reparer.json », qui est réécrit là-bas).
# Visibilité Google + Bing et site FATMA chaque jour ; mode téléphone le lundi (tous les sites), sinon les pages du carnet.
# Un défaut est d'abord revu, puis noté au carnet (robot VERT) ; toujours là après 3 jours -> ROUGE (GitHub prévient Ahmed).
name: controle-visibilite
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
concurrency:
  group: controle-visibilite
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  controle:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Ah6259/projets-ahmed
          ssh-key: ${{ secrets.CLE_PROJETS }}
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            outils visibilite/
            defauts a reparer.json
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Visibilité Google + Bing (revue 5 minutes plus tard en cas de défaut)
        run: |
          node "outils visibilite/controle.mjs" > controle.txt 2>&1 || { sleep 300; node "outils visibilite/controle.mjs" > controle.txt 2>&1; } || true
          cat controle.txt
      - name: Mode téléphone (lundi ou bouton -> tous les sites ; autres jours -> pages du carnet)
        run: |
          if [ "$(date +%u)" = "1" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            node "outils visibilite/telephone.mjs" tous captures-telephone 6 > telephone.txt 2>&1 || true
          else
            node "outils visibilite/telephone.mjs" carnet captures-telephone > telephone.txt 2>&1 || true
          fi
          cat telephone.txt
      - name: Site FATMA Research Data (data.clicvia.com) — revu 3 minutes plus tard en cas de défaut
        run: |
          node "outils visibilite/controle_data.mjs" > data.txt 2>&1 || true
          if grep -q "^DÉFAUT" data.txt; then sleep 180; node "outils visibilite/controle_data.mjs" > data.txt 2>&1 || true; fi
          cat data.txt
      - name: Carnet des défauts à réparer (rouge seulement si un défaut attend depuis plus de 3 jours)
        run: |
          if python3 "outils visibilite/a_reparer.py" controle controle.txt telephone telephone.txt data data.txt; then echo "ROUGE=0" >> "$GITHUB_ENV"; else echo "ROUGE=1" >> "$GITHUB_ENV"; fi
      - name: Enregistrer le carnet dans projets-ahmed s'il a changé
        run: |
          git config user.name "robot-controle"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "defauts a reparer.json"
          if git diff --cached --quiet; then echo "Carnet inchangé."; exit 0; fi
          git commit -q -m "Carnet des défauts à réparer du $(date +'%d/%m/%Y')"
          for i in 1 2 3; do git pull -q --rebase && git push -q && exit 0; sleep 10; done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: captures-telephone
          path: captures-telephone
          if-no-files-found: ignore
          retention-days: 14
      - name: Résultat
        run: |
          if [ "$ROUGE" = "1" ]; then echo "Un défaut attend depuis plus de 3 jours (voir le carnet) : Ahmed est prévenu."; exit 1; fi
          echo "Rien qui attende depuis plus de 3 jours."
